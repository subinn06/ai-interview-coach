services:
  backend:
    build:
      context: ./backend
    container_name: job-analyzer-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: job-analyzer-postgres
    environment:
      POSTGRES_USER: interview_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ai_interview_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_user -d ai_interview_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

